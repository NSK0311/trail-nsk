
<html>
    <head>
        <title>Attribute Selector</title>
        <meta charset="UTF-8">
		<style>
		ul li a {
padding-left: 40px; /* Space for icons */
background-repeat: no-repeat;
font-size: 24px; /* Adjusted font size */
text-decoration: none;
display: inline-block;
margin-bottom: 15px;
}

/* Style for links with http */
a[href^="http://www.google.com"] {
background-image: url('http-icon.png'); /* Replace with actual icon URL or path */
}

/* Style for links with https */
a[href^="https:/www.google.com/"] {
background-image: url('https-icon.png'); /* Replace with actual icon URL or path */
}

/* Style for links with mailto */
a[href^="mailto:"] {
background-image: url('email-icon.png'); /* Replace with actual icon URL or path */
}

/* Style for links with ftp */
a[href^="ftp://"] {
background-image: url('ftp-icon.png'); /* Replace with actual icon URL or path */

		</style>
    </head>
    <body>
        <ul>
            <li><a href="http://www.google.com">Visit a website</a></li><br><br>
            <li><a href="https://www.google.com">Visit a secure website</a></li><br><br>
            <li><a href="mailto:email@email.com">Send an email</a></li><br><br>
            <li><a href="ftp://www.google.com">Connect to an FTP server</a></li><br>
       </ul>
    </body>
</html>
